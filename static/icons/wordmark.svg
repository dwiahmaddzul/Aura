<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140" role="img" aria-label="Aura">
  <title>Aura</title>
  <defs>
    <radialGradient id="wOrb" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="22%" stop-color="#ffd58a"/>
      <stop offset="55%" stop-color="#c9aa72"/>
      <stop offset="85%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#3b2e7a"/>
    </radialGradient>
    <radialGradient id="wHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b61ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9aa72"/>
      <stop offset="60%" stop-color="#ff6bcd"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="wSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Mark on the left -->
  <g transform="translate(70, 70)">
    <circle r="58" fill="url(#wHalo)" filter="url(#wSoft)"/>
    <circle r="54" fill="none" stroke="#c9aa72" stroke-width="0.8" opacity="0.28"/>
    <circle r="42" fill="none" stroke="#7b61ff" stroke-width="1.5" opacity="0.45"/>
    <circle r="30" fill="none" stroke="#ff6bcd" stroke-width="1.2" opacity="0.55"/>
    <circle r="26" fill="#7b61ff" opacity="0.5" filter="url(#wSoft)"/>
    <circle r="20" fill="url(#wOrb)"/>
    <ellipse cx="-5" cy="-7" rx="6" ry="4" fill="#fff" opacity="0.4"/>
  </g>

  <!-- Wordmark -->
  <text x="155" y="88" font-family="'Clash Display', 'Inter', system-ui, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-2"
        fill="url(#wText)">Aura</text>

  <!-- Tagline -->
  <text x="156" y="112" font-family="'Sora', system-ui, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.6"
        fill="#6e6e88">tempat curhatmu sendiri</text>
</svg>
