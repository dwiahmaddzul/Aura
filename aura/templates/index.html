<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Aura</title>
<meta name="description" content="Tempat curhatmu sendiri — diary yang ngalir kayak medsos pribadi.">
<meta name="theme-color" content="#0c0a1c">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon.svg') }}">
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="topbar">
  <div class="logo">
    <img src="{{ url_for('static', filename='icons/icon-mark.svg') }}" alt="" width="28" height="28" style="vertical-align:-7px;margin-right:4px">
    Aura
  </div>
  <div class="topbar-r">
    <button class="ib" onclick="switchPage('notif')" style="position:relative">
      <span class="npip"></span>
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="ib" onclick="switchPage('dm')">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
  </div>
</div>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="stories" id="sw"></div>
  <div class="divider"></div>
  <div id="dailyBanner"></div>
  <div id="throwbackBanner"></div>
  <div class="cbar" onclick="openC()">
    <div class="av av-me" id="composeAvatar">K</div>
    <div class="cph">Apa yang lagi kamu pikirin?</div>
    <div class="cacts">
      <button onclick="event.stopPropagation();document.getElementById('fi').click()">📷</button>
      <input type="file" id="fi" accept="image/*" onchange="handleFile(event)">
      <button class="pchip" onclick="event.stopPropagation();openC()">Post</button>
    </div>
  </div>
  <div id="feed"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div>
</div>

<!-- SEARCH -->
<div class="page" id="page-search">
  <div class="sb-wrap">
    <input class="sb-inp" id="searchInput" placeholder="🔍 Cari post, persona, atau DM…" oninput="doSearch(this.value)">
  </div>
  <div id="searchResults">
    <div class="sr-h">Teman</div>
    <div class="sl" id="pl"></div>
  </div>
</div>

<!-- NOTIF -->
<div class="page" id="page-notif">
  <div style="padding:18px 18px 14px;font-family:'Clash Display',sans-serif;font-size:20px;font-weight:700">Notifikasi</div>
  <div class="sl" id="nl"></div>
</div>

<!-- PROFILE (self) -->
<div class="page" id="page-profile">
  <div class="prh">
    <div class="prt">
      <div class="prpic" id="myAvatar" style="background:linear-gradient(135deg,var(--acc),var(--a2));cursor:pointer" onclick="openMyStoryUpload()">K</div>
      <div class="prs">
        <div class="st"><span class="stn" id="sp">0</span><span class="stl2">Posts</span></div>
        <div class="st"><span class="stn" id="streakCount">0</span><span class="stl2">Streak 🔥</span></div>
        <div class="st"><span class="stn" id="likedCount">0</span><span class="stl2">Liked</span></div>
      </div>
    </div>
    <div class="prn" id="myDisplayName">Kamu 👤</div>
    <div class="prh2">@kamu · Aura</div>
    <div class="prb" id="myBio">✨ Living, learning, creating.
🎨 Design & tech. Jakarta 🇮🇩</div>
    <div class="pra">
      <button class="prbt" onclick="openEditProfile()">Edit Profil</button>
      <button class="prbt" onclick="shareProfile()">Bagikan</button>
    </div>
  </div>
  <div class="ptabs">
    <div class="ptab active" onclick="switchPT(this,'grid')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </div>
    <div class="ptab" onclick="switchPT(this,'tweets')">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="ptab" onclick="switchPT(this,'liked')">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </div>
    <div class="ptab" onclick="switchPT(this,'saved')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="ptab" onclick="switchPT(this,'mood')">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 3-3 3 3 5-5"/></svg>
    </div>
  </div>
  <div id="pc2"><div class="pgrid" id="pg"></div></div>
</div>

<!-- DM PAGE -->
<div class="page" id="page-dm">
  <div style="padding:18px 18px 10px;font-family:'Clash Display',sans-serif;font-size:20px;font-weight:700">Pesan</div>
  <div id="dmList" class="dm-l"></div>
  <div id="dmThread" class="dm-thread" style="display:none"></div>
</div>

<!-- NAV -->
<nav class="bnav">
  <div class="ni active" id="nav-home" onclick="switchPage('home')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </div>
  <div class="ni" id="nav-search" onclick="switchPage('search')">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  </div>
  <div class="ni" id="nav-post" onclick="openC()">
    <div class="np"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
  </div>
  <div class="ni" id="nav-notif" onclick="switchPage('notif')">
    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </div>
  <div class="ni" id="nav-profile" onclick="switchPage('profile')">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </div>
</nav>

<!-- COMPOSE MODAL -->
<div class="ov" id="modal" onclick="closeO(event)">
  <div class="sheet">
    <div class="sh"></div>
    <div class="shd"><div class="sht">Buat Postingan</div><button class="xb" onclick="closeC()">×</button></div>
    <div class="sca">
      <div class="av av-me" style="width:36px;height:36px;font-size:14px">K</div>
      <textarea id="ct" placeholder="Apa yang lagi kamu pikirin?…" oninput="cntCh()" maxlength="280"></textarea>
    </div>
    <div id="iprev" style="display:none" class="ip">
      <img id="iel" src="" alt=""><button class="rim" onclick="rmImg()">×</button>
    </div>
    <div class="mp">
      <div class="mp-l">Mood hari ini?</div>
      <div class="mp-c">
        <button class="mc" type="button" onclick="pickMood(this,'senang')">😊</button>
        <button class="mc" type="button" onclick="pickMood(this,'sedih')">😢</button>
        <button class="mc" type="button" onclick="pickMood(this,'capek')">😴</button>
        <button class="mc" type="button" onclick="pickMood(this,'excited')">✨</button>
        <button class="mc" type="button" onclick="pickMood(this,'bingung')">🤔</button>
        <button class="mc" type="button" onclick="pickMood(this,'tenang')">😌</button>
      </div>
    </div>
    <div id="emojiPanel" style="display:none;padding:10px;background:var(--s1);border-radius:10px;margin-bottom:8px;border:1px solid var(--bd)">
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        <button class="mc" type="button" onclick="addEmoji('😀')">😀</button><button class="mc" type="button" onclick="addEmoji('😂')">😂</button><button class="mc" type="button" onclick="addEmoji('🥹')">🥹</button><button class="mc" type="button" onclick="addEmoji('😭')">😭</button><button class="mc" type="button" onclick="addEmoji('🥲')">🥲</button><button class="mc" type="button" onclick="addEmoji('😴')">😴</button><button class="mc" type="button" onclick="addEmoji('🤔')">🤔</button><button class="mc" type="button" onclick="addEmoji('🙃')">🙃</button><button class="mc" type="button" onclick="addEmoji('😌')">😌</button><button class="mc" type="button" onclick="addEmoji('🥰')">🥰</button><button class="mc" type="button" onclick="addEmoji('😎')">😎</button><button class="mc" type="button" onclick="addEmoji('🤩')">🤩</button><button class="mc" type="button" onclick="addEmoji('💀')">💀</button><button class="mc" type="button" onclick="addEmoji('✨')">✨</button><button class="mc" type="button" onclick="addEmoji('🔥')">🔥</button><button class="mc" type="button" onclick="addEmoji('💯')">💯</button><button class="mc" type="button" onclick="addEmoji('🎉')">🎉</button><button class="mc" type="button" onclick="addEmoji('☕')">☕</button><button class="mc" type="button" onclick="addEmoji('🌙')">🌙</button><button class="mc" type="button" onclick="addEmoji('☀️')">☀️</button><button class="mc" type="button" onclick="addEmoji('🌧️')">🌧️</button><button class="mc" type="button" onclick="addEmoji('💜')">💜</button><button class="mc" type="button" onclick="addEmoji('❤️')">❤️</button><button class="mc" type="button" onclick="addEmoji('🫶')">🫶</button>
      </div>
    </div>
    <div class="sf">
      <button class="stl" onclick="document.getElementById('fi2').click()">📷</button>
      <input type="file" id="fi2" accept="image/*" onchange="handleFile(event)">
      <button class="stl" onclick="toggleEmoji()">😊</button>
      <span class="cc" id="cc2">280</span>
      <button class="pbtn" id="pbtn" onclick="subPost()">Post ✦</button>
    </div>
  </div>
</div>

<!-- STORY VIEWER -->
<div class="sv" id="sv">
  <div class="svb" id="sv-bars"></div>
  <div class="svt">
    <div class="svav" id="svav"></div>
    <div class="svu" id="svun">...</div>
    <div class="svti" id="sv-time">baru saja</div>
    <button class="svcl" onclick="closeSV()">×</button>
  </div>
  <div class="svc" id="sve">
    <div class="sv-tap sv-tap-left" onclick="storyPrev()"></div>
    <div class="sv-tap sv-tap-right" onclick="storyNext()"></div>
  </div>
  <div class="svbot">
    <input class="svrep" id="svReplyInput" placeholder="Balas story…" onkeydown="if(event.key==='Enter')sendStoryReply()">
    <button class="svh" id="svLikeBtn" onclick="likeStory()">🤍</button>
  </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div class="ov" id="editModal" onclick="closeEditP(event)">
  <div class="sheet">
    <div class="sh"></div>
    <div class="shd"><div class="sht">Edit Profil</div><button class="xb" onclick="closeEditProfile()">×</button></div>
    <div style="text-align:center;margin-bottom:16px">
      <div class="epi-av" id="epAvatarPrev">K</div>
      <div style="font-size:11px;color:var(--mu);margin-top:6px">Avatar (1 huruf/emoji)</div>
    </div>
    <div class="epi">
      <label class="epi-l">Avatar</label>
      <input class="epi-i" id="epAvatar" maxlength="4" oninput="document.getElementById('epAvatarPrev').textContent=this.value||'K'">
    </div>
    <div class="epi">
      <label class="epi-l">Nama Tampilan</label>
      <input class="epi-i" id="epName" maxlength="40" placeholder="Kamu 👤">
    </div>
    <div class="epi">
      <label class="epi-l">Bio</label>
      <textarea class="epi-t" id="epBio" maxlength="200" placeholder="Cerita tentang diri lo..."></textarea>
    </div>
    <button class="pbtn" style="width:100%" onclick="saveProfile()">Simpan</button>
  </div>
</div>

<!-- STORY UPLOAD MODAL -->
<div class="ov" id="storyUploadModal" onclick="closeStoryUp(event)">
  <div class="sheet">
    <div class="sh"></div>
    <div class="shd"><div class="sht">Story Baru</div><button class="xb" onclick="closeStoryUpload()">×</button></div>
    <div id="suPrev" style="display:none;margin-bottom:10px">
      <img id="suImg" style="width:100%;border-radius:10px;max-height:300px;object-fit:cover">
    </div>
    <button class="prbt" style="width:100%;margin-bottom:10px" onclick="document.getElementById('suFile').click()">📷 Pilih Foto</button>
    <input type="file" id="suFile" accept="image/*" onchange="handleStoryFile(event)">
    <textarea class="epi-t" id="suCaption" placeholder="Caption (opsional)..." maxlength="200"></textarea>
    <button class="pbtn" style="width:100%;margin-top:10px" onclick="submitStory()" id="suSubmit" disabled>Post Story ✦</button>
  </div>
</div>

<!-- REPOST MODAL -->
<div class="ov" id="repostModal" onclick="closeRepost(event)">
  <div class="sheet">
    <div class="sh"></div>
    <div class="shd"><div class="sht">Repost</div><button class="xb" onclick="closeRepost()">×</button></div>
    <textarea class="epi-t" id="rpExtra" placeholder="Tambah pendapat lo (opsional)..." maxlength="280"></textarea>
    <div class="rp-orig" id="rpOrig"></div>
    <button class="pbtn" style="width:100%;margin-top:12px" onclick="submitRepost()">Repost ✦</button>
  </div>
</div>

<!-- AI PROFILE OVERLAY -->
<div class="prof-ov" id="profOv">
  <div class="prof-sheet">
    <button class="prof-back" onclick="closeProfOv()">← Kembali</button>
    <div id="profContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- JS — load order matters: main first, then domain modules -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/stories.js') }}"></script>
<script src="{{ url_for('static', filename='js/feed.js') }}"></script>
<script src="{{ url_for('static', filename='js/profile.js') }}"></script>
<script src="{{ url_for('static', filename='js/compose.js') }}"></script>
<script src="{{ url_for('static', filename='js/dm.js') }}"></script>
<script src="{{ url_for('static', filename='js/daily.js') }}"></script>
</body>
</html>
