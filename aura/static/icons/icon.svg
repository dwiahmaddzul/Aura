<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aura">
  <title>Aura</title>
  <defs>
    <radialGradient id="aOrb" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="22%" stop-color="#ffd58a"/>
      <stop offset="55%" stop-color="#c9aa72"/>
      <stop offset="85%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#3b2e7a"/>
    </radialGradient>
    <radialGradient id="aBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1a1430"/>
      <stop offset="60%" stop-color="#0c0a1c"/>
      <stop offset="100%" stop-color="#050410"/>
    </radialGradient>
    <radialGradient id="aHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b61ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7b61ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#aBg)"/>

  <!-- Soft halo (outer glow under everything) -->
  <circle cx="256" cy="256" r="200" fill="url(#aHalo)" filter="url(#aSoft)"/>

  <!-- Outer aura ring (gold, faint) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#c9aa72" stroke-width="1.2" opacity="0.22"/>
  <circle cx="256" cy="256" r="186" fill="#c9aa72" opacity="0.025"/>

  <!-- Mid ring (purple, brighter) -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#7b61ff" stroke-width="2" opacity="0.42"/>
  <circle cx="256" cy="256" r="142" fill="#7b61ff" opacity="0.055"/>

  <!-- Inner ring (pink accent) -->
  <circle cx="256" cy="256" r="104" fill="none" stroke="#ff6bcd" stroke-width="1.6" opacity="0.48"/>

  <!-- Underglow before orb -->
  <circle cx="256" cy="256" r="88" fill="#7b61ff" opacity="0.55" filter="url(#aSoft)"/>

  <!-- Central orb -->
  <circle cx="256" cy="256" r="68" fill="url(#aOrb)"/>

  <!-- Highlight on orb -->
  <ellipse cx="238" cy="232" rx="20" ry="14" fill="#fff" opacity="0.35"/>

  <!-- Sparkles -->
  <g fill="#fff5db">
    <circle cx="378" cy="148" r="2.6" opacity="0.85"/>
    <circle cx="118" cy="378" r="3.2" opacity="0.7"/>
    <circle cx="400" cy="338" r="2.2" opacity="0.65"/>
    <circle cx="148" cy="170" r="1.8" opacity="0.55"/>
    <path d="M380 142 L380 154 M374 148 L386 148" stroke="#fff5db" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
